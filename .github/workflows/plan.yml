name: terraform-plan

# Runs on every PR targeting main. Read-only: assumes the scoped PLAN role via
# OIDC (no stored AWS keys), runs fmt/validate/security-scan/plan, and posts the
# plan back to the PR. It CANNOT mutate infrastructure.
on:
  pull_request:
    branches: [main, feat/content-*, feat/cms-*]

# OIDC needs id-token: write. Everything else least-privilege.
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_VAR_ip_hash_secret: ${{ secrets.IP_HASH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub withholds Actions secrets from Dependabot-authored pull requests. Dependency
      # updates still run the clean install, lint, tests, and production build below; Terraform
      # remains unchanged because these PRs are limited to files under web/.
      - name: Configure AWS credentials (OIDC, plan role)
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The site is uploaded from web/dist by frontend.tf, so the build MUST run before
      # Terraform — otherwise the plan is computed against stale or absent output.
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test

      - name: Record Dependabot validation scope
        if: github.actor == 'dependabot[bot]'
        run: echo 'Dependabot PR validated with install, lint, tests, and production build; Terraform plan skipped because Actions secrets are unavailable.'

      - name: Setup Terraform
        if: github.actor != 'dependabot[bot]'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.2"

      - name: Terraform fmt
        if: github.actor != 'dependabot[bot]'
        run: terraform fmt -check -recursive

      - name: Terraform init
        if: github.actor != 'dependabot[bot]'
        run: terraform init -input=false

      - name: Terraform validate
        if: github.actor != 'dependabot[bot]'
        run: terraform validate

      - name: Checkov security scan
        if: github.actor != 'dependabot[bot]'
        continue-on-error: true
        run: |
          pipx install checkov
          checkov -d . --quiet --compact --framework terraform

      - name: Terraform plan
        if: github.actor != 'dependabot[bot]'
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: always() && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Terraform Plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md
