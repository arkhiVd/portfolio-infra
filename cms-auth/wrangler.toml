name = "portfolio-cms-auth"
main = "src/index.js"
compatibility_date = "2026-09-11"
workers_dev = false

routes = [
  { pattern = "cms-auth.aravindakrishnan.cloud", custom_domain = true }
]

[assets]
directory = ".worker-assets"
run_worker_first = ["/auth", "/callback", "/oauth/*"]

[vars]
ALLOWED_DOMAINS = "cms-auth.aravindakrishnan.cloud"
