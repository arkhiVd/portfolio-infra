<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1195 821" width="1195" height="821" role="img" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
<title>ClearSky architecture: CloudFront serves the dashboard from S3 and routes /api to a Lambda API. The API starts scans, chat and diagram jobs. A daily schedule runs the scanner, which assumes a read-only role in member accounts, stores findings in DynamoDB and sends a digest by email. GitHub Actions deploys through OIDC roles.</title>
